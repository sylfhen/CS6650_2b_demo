# Local observability stack: Product API + Prometheus + Grafana.
# Usage (from observability/):
#   TARGET_ARCH=arm64 docker compose up -d --build   # Apple Silicon (native)
#   docker compose up -d --build                     # any machine (amd64)
# Then open http://localhost:3000 (Grafana) and http://localhost:9090 (Prometheus).
services:
  app:
    build:
      context: ../src
      args:
        TARGET_ARCH: ${TARGET_ARCH:-amd64}
    image: product-service:observability
    ports:
      - "8081:8080"
    environment:
      ENABLE_FAULT_INJECTION: "true"
      SEED_PRODUCTS: "1000"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/product-api.json"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
